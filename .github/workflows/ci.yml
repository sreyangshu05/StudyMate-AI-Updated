name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (check + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Module import check
        run: cd backend && npm run check
      - name: Run backend test suite (incl. load + 2s soak)
        run: cd backend && npm test
      # A longer soak in CI proves sustained stability without slowing the
      # pipeline much; bump SOAK_SECONDS locally for hours-long validation.
      - name: Soak test (12s, single file)
        run: cd backend && SOAK_SECONDS=12 node --test --test-concurrency=1 test/soak.test.js

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Frontend component + a11y tests
        run: cd frontend && bun run test
      - name: Production build
        run: cd frontend && bun run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Backend must be installable so the e2e global setup can import createApp.
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Install Playwright Chromium
        run: cd frontend && bunx playwright install chromium --with-deps
      - name: Build e2e frontend (relative API base)
        run: cd frontend && bun run build:e2e && cp -a dist dist-e2e
      - name: Run Playwright e2e suite
        run: cd frontend && bun run test:e2e
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/results
          if-no-files-found: ignore
EOF