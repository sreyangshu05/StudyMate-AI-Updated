# Serve the StudyMate SPA and proxy /api to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Expose the backend health/ready so orchestrators can probe through nginx.
    location /api/health {
        proxy_pass http://backend:5000/api/health;
        proxy_set_header Host $host;
        proxy_read_timeout 5s; 
    }
    location /api/ready {
        proxy_pass http://backend:5000/api/ready;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # All API traffic -> backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        # Buffer for large uploads (PDFs)
        client_max_body_size 25m;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Content-Security-Policy: scripts restricted to same origin with NO
    # 'unsafe-eval'. This is defense-in-depth against the pdfjs-dist
    # eval("require") caveat (build/pdf.js ~line 1982): that code path is gated
    # behind isNodeJS and only reachable in Node, never the browser. With this
    # CSP the browser would block any eval() / new Function() at runtime even
    # if a future change accidentally exposed it. The PDF worker loads from a
    # same-origin static asset (/3.11.174/pdf.worker.min.js), covered by
    # worker-src 'self'. Inline styles are allowed for React runtime + toast.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
